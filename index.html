    <script>
      tailwind.config = {
        darkMode: 'class', // Enable class-based dark mode
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              // Vercel-like palette
              'vercel-blue': '#0070F3',
              'vercel-pink': '#FF0080', // Example secondary accent, less used
              'accents-1': '#FAFAFA',
              'accents-2': '#EAEAEA',
              'accents-3': '#999',
              'accents-4': '#888',
              'accents-5': '#666',
              'accents-6': '#444',
              'accents-7': '#333',
              'accents-8': '#111',
              'geist-foreground': '#000',
              'geist-secondary': '#666',
              'geist-background': '#fff',
              // Dark mode specific
              'dark-geist-foreground': '#fff',
              'dark-geist-secondary': '#888', 
              'dark-geist-background': '#000',
              'dark-accents-1': '#111', 
              'dark-accents-2': '#333', 
              // Colors for <mark> tag
              'mark-bg-light': '#FFF3A3', // A light yellow
              'mark-text-light': '#573A00', // Darker text for light yellow
              'mark-bg-dark': '#6B5800', // A muted gold/yellow for dark mode
              'mark-text-dark': '#FFF3A3', // Lighter text for dark gold
            },
            boxShadow: {
              'vercel-sm': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
              'vercel-md': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
              'vercel-lg': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
            }
          }
        },
        // Added corePlugins to ensure mark styling is possible if not default
        corePlugins: {
            textOpacity: true,
            backgroundOpacity: true,
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        mark {
          @apply bg-mark-bg-light text-mark-text-light px-0.5 rounded-sm;
        }
        .dark mark {
          @apply bg-mark-bg-dark text-mark-text-dark;
        }

    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",

</head>
  <body class="font-sans bg-geist-background dark:bg-dark-geist-background text-geist-foreground dark:text-dark-geist-foreground transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      const isLocalDevHost = ['localhost', '127.0.0.1', '0.0.0.0'].includes(window.location.hostname);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (isLocalDevHost) {
            navigator.serviceWorker.getRegistrations()
              .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
              .then(() => {
                console.log('Service workers unregistered for local development.');
              })
              .catch((error) => {
                console.warn('Could not unregister service workers in local development:', error);
              });
            return;
          }

          const serviceWorkerUrl = '/service-worker.js';

          fetch(serviceWorkerUrl, { method: 'HEAD' })
            .then((response) => {
              if (!response.ok) {
                console.warn('Service worker script not found; skipping registration.', serviceWorkerUrl);
                return null;
              }
              return navigator.serviceWorker.register(serviceWorkerUrl);
            })
            .then((registration) => {
              if (registration) {
                console.log('Service Worker registered with scope:', registration.scope, 'From URL:', serviceWorkerUrl);
              }
            })
            .catch((error) => {
              console.error('Service Worker registration failed:', error, 'Attempted URL:', serviceWorkerUrl);
            });
        });
      }
    </script>
  </body>
