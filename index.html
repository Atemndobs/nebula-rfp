
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RFP Discovery Platform - Vercel Style</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color for Browser UI -->
    <meta name="theme-color" content="#8B5CF6" />

    <!-- Apple PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RFP Tool V2">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='90' cy='90' r='85' fill='white'/%3E%3Ccircle cx='90' cy='90' r='78' fill='purple'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='80' fill='white'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E">
    <!-- Add more apple-touch-icon sizes if needed -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cstyle%3E.code-text %7B font-family: 'Courier New', Courier, monospace; fill: %23333333; %7D%3C/style%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='29' fill='white' stroke='purple' stroke-width='4'/%3E%3Ctext class='code-text' x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='30'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E" />
    
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.1.0"
  }
}
</script>
</head>
  <body class="font-sans bg-geist-background dark:bg-dark-geist-background text-geist-foreground dark:text-dark-geist-foreground transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      const isLocalDevHost = ['localhost', '127.0.0.1', '0.0.0.0'].includes(window.location.hostname);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (isLocalDevHost) {
            navigator.serviceWorker.getRegistrations()
              .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
              .then(() => {
                console.log('Service workers unregistered for local development.');
              })
              .catch((error) => {
                console.warn('Could not unregister service workers in local development:', error);
              });
            return;
          }

          const serviceWorkerUrl = '/service-worker.js';

          fetch(serviceWorkerUrl, { method: 'HEAD' })
            .then((response) => {
              if (!response.ok) {
                console.warn('Service worker script not found; skipping registration.', serviceWorkerUrl);
                return null;
              }
              return navigator.serviceWorker.register(serviceWorkerUrl);
            })
            .then((registration) => {
              if (registration) {
                console.log('Service Worker registered with scope:', registration.scope, 'From URL:', serviceWorkerUrl);
              }
            })
            .catch((error) => {
              console.error('Service Worker registration failed:', error, 'Attempted URL:', serviceWorkerUrl);
            });
        });
      }
    </script>
  </body>
</html>
